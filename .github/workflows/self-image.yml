name: self-image

on:
  push:
    branches: [self]
  workflow_dispatch:

concurrency:
  group: self-image
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/liushuangls/cliproxyapi

jobs:
  verify:
    if: github.repository == 'liushuangls/CLIProxyAPI' && github.ref == 'refs/heads/self'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify backend, persistent usage and lifecycle
        run: |
          go test ./...
          go test -race ./internal/usagehistory ./sdk/cliproxy/usage ./internal/config
          go test ./internal/api/handlers/management ./internal/api ./internal/managementasset ./internal/runtime/executor/helps -run 'Test(ParseUsageHistory|CredentialUsageHistory|CredentialTryout|BundledPanel|UsageReporterHomeAdditionalModelAccounting)'
          go test ./sdk/cliproxy -run 'TestService(Run|Shutdown)|TestUsageHistory'
          go build -o /tmp/cli-proxy-api ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify pinned management UI
        working-directory: management-ui
        run: |
          bun install --frozen-lockfile
          bun run verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "ui=$(git -C management-ui rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and publish candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.self
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VERSION=self-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=self
            io.cliproxyapi.management-ui.revision=${{ steps.meta.outputs.ui }}
          cache-from: type=gha,scope=self-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=self-${{ matrix.arch }}
      - name: Smoke test the native container
        env:
          CANDIDATE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: bash scripts/smoke-self-image.sh "$CANDIDATE_IMAGE"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-architecture tags
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:self" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"
          printf 'Published `%s:self` and `%s:sha-%s` (linux/amd64, linux/arm64).\n' \
            "$IMAGE" "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
